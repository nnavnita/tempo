  T3:
    name: Events have a live shared space (chat, photos, notes, presence) and the app opens straight into it when the user is mid-event
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A user attending an in-progress event with 2+ Tempo attendees cold-starts the app and lands in that event's space without further navigation
    - Within a space, the user can post text messages, upload photos, add shared notes, and see who else is currently present
    - Dismissing the auto-open for an event prevents it recurring for that event on subsequent cold starts within the same event window
    - Firestore and Storage rules restrict all space reads and writes to the event owner and attendees, verified by rules tests
    context: |-
      When a user opens Tempo during an event they are attending, the app should drop them directly into that event's shared space rather than the normal home surface. The space is where attendees chat, share photos, and keep shared notes for the event. Spaces exist from event creation onward and stay writable indefinitely.

      Two frictions accepted at design time and carried into the sub-targets:
      1. Hijack frequency: triggering on any synced Google Calendar event with 2+ attendees means routine meetings seize the app on launch. Mitigated by the per-event dismissal flag in T3.9, which is required rather than optional.
      2. Identity gap: EventModel.attendeeUids holds Firestore uids, but Google Calendar attendees are email strings. Space membership is the intersection of event attendees with Tempo users. The "2+ attendees" trigger condition counts Tempo attendees, not raw calendar attendees, so the redirect never fires into an empty room. T3.7 owns that resolution.

      Space access rules should read the resolved uid sets produced by T2.4's visibility resolution rather than re-deriving membership, to avoid two divergent access models in firestore.rules.
    tags:
    - mobile
    - events
    - social
    - realtime
    origin: manual
    discovered: 2026-08-30
