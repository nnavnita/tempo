  T2.7:
    name: Event create/update flow resolves include/exclude selections into visibleUids/excludeUids before every write
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - lib/services/calendar/calendar_sync_service.dart's createEvent gains includeGroupIds, includeFriendUids, excludeGroupIds, excludeFriendUids params (default const []), calls the T2.4 resolver before constructing EventModel, and sets visibleUids/excludeUids on the constructed event
    - updateEvent(EventModel updated) recomputes visibleUids/excludeUids from updated's own include/exclude fields via the same resolver before writing, so edits to group/individual selections take effect immediately on save (per the spec's snapshot-at-save-time decision)
    - create_event_screen.dart's _save() passes the 4 new state fields from the visibility selector (T2.6) through to calendarSyncServiceProvider.createEvent
    - edit_event_screen.dart wired the same way for updates
    - 'Manually verified: create an event shared with a group, confirm a group member (not previously an individual friend-grant) can see it in their friend-events view; add an exclude and confirm that person no longer sees it'
    context: Wires T2.4's resolver into the real save path used by both create and edit screens.
    depends_on:
