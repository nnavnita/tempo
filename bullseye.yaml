    - A killed app process does not leave a permanently stuck present entry
    - The presence mechanism's steady-state write volume per active user is measured and documented
    context: |-
      The heaviest infrastructure item in T3 relative to its value, and the most reasonable candidate to defer to a follow-up if T3 needs to ship sooner. Presence needs either periodic heartbeat writes to Firestore (write-volume cost, stale-entry cleanup) or Firebase Realtime Database with onDisconnect (a second database product alongside Firestore).

