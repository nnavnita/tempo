  T3.7:
    name: Google-only calendar events lazily mint a Tempo event doc with attendee emails resolved to Tempo uids
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Entering the space for a synced Google Calendar event with no Tempo doc creates exactly one EventModel doc linked by googleCalendarEventId
    - Attendee emails matching existing Tempo accounts appear in attendeeUids; non-matching emails do not
    - Concurrent entry from two clients results in a single event doc, verified by a test exercising the idempotency path
    - A minted event is distinguishable from a Tempo-authored one so it does not pollute the user's own event lists unexpectedly
    context: |-
      Bridges the identity gap between the two attendee representations. Google Calendar attendees are email strings; EventModel.attendeeUids holds Firestore uids. A calendar event that was never created in Tempo has no event doc, so it has nothing for a space to hang off.

      On first space entry for such an event, mint an EventModel doc keyed off the Google Calendar event id, and resolve each attendee email against Tempo user accounts, populating attendeeUids with those that match. Attendees without Tempo accounts are simply absent from the space — this is expected, and is what makes the Tempo-attendee count in T3.8 meaningful.

      Minting must be idempotent: two devices entering the same event concurrently must not create duplicate docs.
    tags:
    - mobile
    - events
    - calendar
    - identity
    origin: manual
    discovered: 2026-08-30
  T3.8:
    name: A live-event resolver returns the user's currently in-progress event with 2+ Tempo attendees
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Given a set of events and a fixed now(), the resolver returns the correct in-progress event, covered by unit tests including boundary cases at exact start and end times
    - Events with fewer than two Tempo attendees are never returned
    - Overlapping in-progress events resolve by a documented, tested rule
    - All-day events and events spanning a timezone change are handled explicitly and tested
    context: |-
      Pure logic, independently unit-testable, and the piece that decides whether the redirect fires at all. Given the current time and the user's events, return the event now in progress that has at least two Tempo attendees — counting resolved uids, never raw Google Calendar attendee emails, so the redirect cannot fire into a room where nobody else has an account.

      Overlapping events are the interesting case and need an explicit rule (most recently started, shortest, or the one the user owns). Timezone and all-day event handling are exactly where this kind of logic usually breaks; test both.
    depends_on:
    - T3.7
    tags:
    - mobile
    - events
    - calendar
    - tests
    origin: manual
    discovered: 2026-08-30
  T3.9:
    name: App launch redirects into the live event space, with a per-event dismissal flag preventing re-hijack
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Cold-starting while attending an in-progress qualifying event lands the user in that event's space with no intermediate navigation
    - Dismissing the space for an event means later cold starts within that same event window go to the normal home surface
    - Cold-starting with no qualifying in-progress event goes to the normal home surface unchanged
    - The redirect never preempts sign-in or onboarding, and never fires before auth state has resolved
    - Back navigation from an auto-opened space reaches the normal home surface rather than exiting the app
    context: |-
      The payoff node, and the one with the most user-facing risk. On cold start, if T3.8 reports an in-progress event, the router sends the user straight to that event's space instead of the normal home surface.

      The dismissal flag is required, not optional. Triggering on any synced Google Calendar event means routine meetings — standups, appointments, recruiter invites — will seize the app on launch. Once the user dismisses the space for a given event, that event must not redirect again for the remainder of its window. Flag storage should be local rather than Firestore: it is device-scoped UI state, not shared event data.

      Redirect must not fight the auth or onboarding flows, and must not fire before auth state resolves.
    depends_on:
    - T3.6
    - T3.8
    tags:
    - mobile
    - events
    - routing
    - ux
    origin: manual
    discovered: 2026-08-30
