# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server, and safe
# to hand-edit (the targets live below).
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit the
# targets, not these lines.
schema_version: 5
targets:
  T1:
    name: 'Tempo MVP: users can schedule events, sync Google Calendar, and coordinate with friends'
    status: converging
    value: 5.0
    cost: 3.0
    acceptance:
    - Auth (Google Sign-In via Firebase) working end-to-end
    - Create/edit/view events with private/friends/everyone visibility, each enforced by Firestore security rules (areFriends() helper)
    - Google Calendar sync on event create + on join-request approval + on invitation accept (CalendarSyncService)
    - Friends list, friend requests, join requests, and invitations all flow through Notifications inbox
    - Public feed shows 'everyone'-visibility events from other users
    - Required Firestore composite indexes (see SETUP.md) deployed
    context: lib/ already implements the full feature set per SETUP.md's architecture overview (auth, calendar, events, friends, feed, notifications, profile all present as features/). This is a from-scratch social calendar app (formerly tracked as 'ai-time-organiser' in planning — this Flutter+Firebase build is the actual implementation, name is now 'tempo'). Not yet published to app stores.
    tags:
    - mobile
    - mvp
    origin: bullseye_init
    discovered: 2026-08-15
  T2:
    name: Friend sub-groups exist and event visibility can target/exclude specific groups or individuals, on top of the existing private/friends/everyone tiers
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - Users can create named, owner-private friend groups (e.g. Housemates) with overlapping membership
    - An event's visibility can additionally include specific groups/individuals beyond its base tier, and explicitly exclude specific groups/individuals even from an everyone/friends-tier event
    - Firestore security rules enforce this without per-request loops (denormalized visibleUids/excludeUids snapshot at save time)
    - Owner/attendee access always bypasses excludeUids
    context: 'First of 5 sub-projects decomposed from a broader social-calendar feature request (see full conversation). The other four — open/public discovery, event content hub (media/todo-lists per event), payments/marketplace — are sequenced after this one since they depend on groups+visibility existing. Design spec: docs/superpowers/specs/2026-08-16-friend-groups-visibility-design.md (approved). Extends the existing T1 MVP''s private/friends/everyone visibility model without breaking it.'
    depends_on:
    - T2.1
    - T2.2
    - T2.3
    - T2.4
    - T2.5
    - T2.6
    - T2.7
    - T2.8
    tags:
    - mobile
    - visibility
    - groups
    origin: manual
    discovered: 2026-08-16
  T2.1:
    name: Friend groups exist as a private, owner-scoped Firestore collection with CRUD
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - lib/models/friend_group_model.dart defines FriendGroupModel{groupId, ownerUid, name, memberUids, createdAt, updatedAt} with fromFirestore(DocumentSnapshot) and toMap(), following the exact pattern in lib/models/friendship_model.dart
    - lib/core/constants/firestore_constants.dart gains friendGroupsCollection = 'friend_groups' plus field constants groupId, name, memberUids (reuse existing ownerUid, createdAt, updatedAt constants)
    - 'lib/services/firestore/friend_group_repository.dart defines FriendGroupRepository with: createGroup({required String ownerUid, required String name}) -> Future<FriendGroupModel>; renameGroup(String groupId, String name) -> Future<void>; deleteGroup(String groupId) -> Future<void>; addMember(String groupId, String memberUid) -> Future<void>; removeMember(String groupId, String memberUid) -> Future<void>; watchGroups(String ownerUid) -> Stream<List<FriendGroupModel>>; getGroup(String groupId) -> Future<FriendGroupModel?>'
    - 'firestore.rules gains a match /friend_groups/{groupId} block: allow read, update, delete if isSignedIn() && isOwner(resource.data.ownerUid); allow create if isSignedIn() && isOwner(request.resource.data.ownerUid)'
    - flutter analyze passes with no new errors in touched files
    context: Foundational data layer for the whole T2 epic. No dependency on EventModel changes (T2.3) — can run in parallel with it.
    tags:
    - mobile
    - groups
    origin: subdivide(🎯T2)
    discovered: 2026-08-16
  T2.2:
    name: User can create, rename, delete groups and manage membership from a dedicated screen
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'lib/features/friends/screens/manage_groups_screen.dart is a new screen: lists current user''s groups via a new groupsProvider StreamProvider (added to lib/providers/friends_provider.dart) wrapping FriendGroupRepository.watchGroups; supports create (name input dialog), rename, delete'
    - Per-group member management reuses the friend-picker chip pattern from _InviteFriendsSection in lib/features/events/screens/create_event_screen.dart (friendUidsProvider + FilterChip)
    - A button/menu item on lib/features/friends/screens/friends_list_screen.dart navigates to the new screen
    - Route registered in lib/config/router/app_router.dart
    - 'Manually verified in a running app: create a group, add 2 friends, rename it, remove one friend, delete it — no crashes, list updates live'
    context: UI layer over T2.1's repository.
    depends_on:
    - T2.1
    tags:
    - mobile
    - groups
    - ui
    origin: subdivide(🎯T2)
    discovered: 2026-08-16
  T2.3:
    name: EventModel supports include/exclude group and friend targeting with denormalized visibleUids/excludeUids fields
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'lib/models/event_model.dart gains fields: includeGroupIds, includeFriendUids, excludeGroupIds, excludeFriendUids, visibleUids, excludeUids (all List<String>, default const [])'
    - fromFirestore, toMap, and copyWith updated to cover all 6 new fields, following the existing pattern for attendeeUids
    - 'lib/core/constants/firestore_constants.dart gains field constants: includeGroupIds, includeFriendUids, excludeGroupIds, excludeFriendUids, visibleUids, excludeUids'
    - flutter analyze passes with no new errors
    context: Pure model change, no dependency on the friend_groups collection existing (T2.1) — can run in parallel with it. See spec section 'Data model' for exact field semantics.
    tags:
    - mobile
    - visibility
    origin: subdivide(🎯T2)
    discovered: 2026-08-16
  T2.4:
    name: Visibility resolution service expands groups+individuals into deduped uid sets, covered by unit tests
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - lib/services/firestore/visibility_resolver.dart defines a pure function Set<String> resolveUids({required List<String> groupIds, required List<String> friendUids, required List<FriendGroupModel> ownerGroups}) that unions friendUids with the memberUids of every group in ownerGroups whose groupId is in groupIds, silently skipping groupIds with no matching group, and dedupes
    - Also defines an async wrapper resolveEventVisibility({required String ownerUid, required List<String> includeGroupIds, required List<String> includeFriendUids, required List<String> excludeGroupIds, required List<String> excludeFriendUids, required FriendGroupRepository groupRepository}) returning ({Set<String> visibleUids, Set<String> excludeUids}) that fetches the owner's groups once and calls resolveUids twice
    - 'test/services/firestore/visibility_resolver_test.dart covers: empty inputs -> empty set; individual-only union; group expansion; dedup across overlapping group+individual entries; a groupId with no matching group is skipped without throwing'
    - flutter test test/services/firestore/visibility_resolver_test.dart passes
    context: Depends on both FriendGroupModel (T2.1) and the new EventModel fields' naming (T2.3) to keep field names consistent.
    depends_on:
    - T2.1
    - T2.3
    tags:
    - mobile
    - visibility
    - tests
    origin: subdivide(🎯T2)
    discovered: 2026-08-16
  T2.5:
    name: Firestore rules enforce visibleUids/excludeUids on events, with exclude never blocking owner or attendee, verified by rules tests
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - firestore.rules events match block's allow read replaced with the corrected rule from docs/superpowers/specs/2026-08-16-friend-groups-visibility-design.md under 'Security rules' (owner/attendee bypass excludeUids; excludeUids gates the everyone/friends/visibleUids paths only)
    - 'Project gains rules-test infra: package.json with firebase-tools and @firebase/rules-unit-testing as devDependencies, firebase.json emulator config for firestore, and a test runner script (npm run test:rules) — none of this exists yet in the repo'
    - 'test/rules/events_visibility.test.js using the Firestore emulator covers: owner reads own private event; friend reads friends-tier event; excluded friend blocked on friends-tier; excluded attendee still allowed (bypass); custom-group member allowed via visibleUids; non-member blocked; everyone-tier event blocked for an excluded uid'
    - npm run test:rules passes against the local emulator
    context: Depends only on T2.3 (needs visibleUids/excludeUids field names to exist in the rule text). Independent of T2.1/T2.2/T2.4/T2.6 — can run in parallel with all of them.
    depends_on:
    - T2.3
    tags:
    - mobile
    - security
    - tests
    origin: subdivide(🎯T2)
    discovered: 2026-08-16
