    - Widget's public API gains one ValueChanged<List<String>> callback per new field (onIncludeGroupsChanged, onIncludeFriendsChanged, onExcludeGroupsChanged, onExcludeFriendsChanged) plus corresponding value params, mirroring the existing single onChanged(visibility) pattern
    - lib/features/events/screens/create_event_screen.dart and edit_event_screen.dart updated to hold the 4 new list-state fields and pass/receive them
    - 'test/features/events/widgets/visibility_selector_test.dart: selecting a group chip in ''Also share with'' calls onIncludeGroupsChanged with the group''s id added; selecting in ''Hide from'' calls onExcludeGroupsChanged; deselecting removes it'
    - flutter test test/features/events/widgets/visibility_selector_test.dart passes
    context: Needs groupsProvider from T2.2 and the new EventModel field names from T2.3 to keep the widget's callback shape consistent with what create/edit screens will pass through in T2.7.
    depends_on:
